name: Copiloto de Reuniões

on:
  push:
    paths:
      - 'copiloto-reunioes/**'
      - '.github/workflows/copiloto-reunioes.yml'
  pull_request:
    paths:
      - 'copiloto-reunioes/**'
      - '.github/workflows/copiloto-reunioes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instalador:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: copiloto-reunioes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: copiloto-reunioes/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: copiloto-reunioes-instalador
          path: copiloto-reunioes/dist/*.exe
